name: Keep Render services warm

on:
  schedule:
    - cron: "*/12 * * * *"  # every 12 minutes — Render free tier spins down after ~15 min idle.
      # GitHub treats `schedule` as best-effort and delays/skips ticks under
      # load, more so for repos without constant activity; a tighter */10
      # interval left less slack for that jitter and led to bursts of
      # overdue/duplicate runs getting cancelled. */12 keeps ~3 min of
      # margin against the 15 min spin-down while giving the scheduler
      # more room.
  workflow_dispatch:  # allows manual triggering from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: gateway
            url: https://ai-microservices-job-portal-gateway.onrender.com/health
          - name: auth
            url: https://ai-microservices-job-portal-nl5v.onrender.com/health
          - name: job
            url: https://ai-microservices-job-portal-job.onrender.com/health
          - name: user
            url: https://ai-microservices-job-portal-user.onrender.com/health
          - name: payment
            url: https://ai-microservices-job-portal-payment.onrender.com/health
          - name: utils
            url: https://ai-microservices-job-portal.onrender.com/health

    steps:
      - name: Ping ${{ matrix.service.name }}
        # 90s, not 60s: a cold boot has taken just over 60s in practice,
        # which was marking a service "failed" here even though it came
        # up fine moments later — this step only needs to wake the
        # service, not prove it responds within an arbitrary window.
        run: curl -sf --max-time 90 "${{ matrix.service.url }}"
