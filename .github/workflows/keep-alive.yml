name: Keep Render services warm

# Schedule trigger intentionally removed (2026-08-21): pinging all 6 services
# every ~12 minutes, 24/7, defeats Render free tier's own idle spin-down,
# which exists specifically to keep usage inside the free monthly
# instance-hour allowance. Doing that across 6 services simultaneously
# exhausted that allowance in days and got every service suspended by
# Render ("This service has been suspended" on every /health check) — a
# full outage, strictly worse than the occasional cold-start 502 this
# workflow was meant to prevent. The frontend's own retry-on-502/503
# interceptor (see frontend/src/context/AppContext.tsx) already makes an
# individual cold start survivable without needing to keep everything
# artificially warm around the clock. Left as workflow_dispatch-only so it
# can still be run manually — e.g. right before a demo/interview — without
# resuming the automatic loop that caused the suspension.
on:
  workflow_dispatch: # allows manual triggering from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: gateway
            url: https://ai-microservices-job-portal-gateway.onrender.com/health
          - name: auth
            url: https://ai-microservices-job-portal-nl5v.onrender.com/health
          - name: job
            url: https://ai-microservices-job-portal-job.onrender.com/health
          - name: user
            url: https://ai-microservices-job-portal-user.onrender.com/health
          - name: payment
            url: https://ai-microservices-job-portal-payment.onrender.com/health
          - name: utils
            url: https://ai-microservices-job-portal.onrender.com/health

    steps:
      - name: Ping ${{ matrix.service.name }}
        # 90s, not 60s: a cold boot has taken just over 60s in practice,
        # which was marking a service "failed" here even though it came
        # up fine moments later — this step only needs to wake the
        # service, not prove it responds within an arbitrary window.
        run: curl -sf --max-time 90 "${{ matrix.service.url }}"
